<!DOCTYPE html>
<html>
<head>
  <title>Transactions</title>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="css/table.css">
</head>

<body>

<div class="table-container">
  <h2>Transactions</h2>

  <table data-test-id="transactions-table">
    <thead>
      <tr>
        <th>Payment ID</th>
        <th>Order ID</th>
        <th>Amount</th>
        <th>Method</th>
        <th>Status</th>
        <th>Created</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>

<script>
fetch("http://localhost:8000/api/v1/transactions", {
  headers: {
    "X-Api-Key": "key_test_abc123",
    "X-Api-Secret": "secret_test_xyz789"
  }
})
.then(res => res.json())
.then(data => {
  const tbody = document.querySelector("tbody");
  tbody.innerHTML = "";

  data.forEach(p => {
    tbody.innerHTML += `
      <tr data-test-id="transaction-row" data-payment-id="${p.id}">
        <td data-test-id="payment-id">${p.id}</td>
        <td data-test-id="order-id">${p.order_id}</td>
        <td data-test-id="amount">${p.amount}</td>
        <td data-test-id="method">${p.method}</td>
        <td data-test-id="status">${p.status}</td>
        <td data-test-id="created-at">${new Date(p.created_at).toLocaleString()}</td>
      </tr>
    `;
  });
});
</script>

</body>
</html>
