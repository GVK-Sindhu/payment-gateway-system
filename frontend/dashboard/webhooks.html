<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Webhook Configuration</title>
</head>
<body>

<div data-test-id="webhook-config">
  <h2>Webhook Configuration</h2>

  <form data-test-id="webhook-config-form">
    <div>
      <label>Webhook URL</label>
      <input
        data-test-id="webhook-url-input"
        type="url"
        placeholder="https://yoursite.com/webhook"
      />
    </div>

    <div>
      <label>Webhook Secret</label>
      <span data-test-id="webhook-secret">whsec_test_abc123</span>
      <button
        type="button"
        data-test-id="regenerate-secret-button">
        Regenerate
      </button>
    </div>

    <button
      type="submit"
      data-test-id="save-webhook-button">
      Save Configuration
    </button>

    <button
      type="button"
      data-test-id="test-webhook-button">
      Send Test Webhook
    </button>
  </form>

  <h3>Webhook Logs</h3>

  <table data-test-id="webhook-logs-table" border="1">
    <thead>
      <tr>
        <th>Event</th>
        <th>Status</th>
        <th>Attempts</th>
        <th>Last Attempt</th>
        <th>Response Code</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr
        data-test-id="webhook-log-item"
        data-webhook-id="log_123">
        <td data-test-id="webhook-event">payment.success</td>
        <td data-test-id="webhook-status">success</td>
        <td data-test-id="webhook-attempts">1</td>
        <td data-test-id="webhook-last-attempt">
          2024-01-15 10:31:11
        </td>
        <td data-test-id="webhook-response-code">200</td>
        <td>
          <button
            data-test-id="retry-webhook-button"
            data-webhook-id="log_123">
            Retry
          </button>
        </td>
      </tr>
    </tbody>
  </table>
</div>

</body>
</html>
